<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Civica Fraud & Misinformation Check</title>
<style>
:root{--primary:#ff7b00;--danger:#b42318;--bg:#fff7ed}*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff,#fff1df);display:grid;place-items:center;padding:24px}.container{width:min(1100px,100%)}h1{text-align:center;color:var(--primary)}.subtitle{text-align:center;color:#666}.card{background:#fff;border:1px solid #ff7b0030;border-radius:20px;padding:28px;box-shadow:0 12px 32px #ff7b0018}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:800px){.split{grid-template-columns:1fr}}.panel{border:1px solid #ff7b0030;border-radius:14px;padding:20px}.toggle{display:flex;gap:8px;margin-bottom:14px}.toggle button{flex:1;padding:10px;border:0;border-radius:9px;cursor:pointer;background:#ff7b0018}.toggle button.active{background:var(--primary);color:#fff}.mode{display:none}.mode.active{display:block}textarea{width:100%;min-height:180px;padding:12px;border:1px solid #ff7b0040;border-radius:9px;resize:vertical}.upload{padding:40px;border:2px dashed #ff7b0066;text-align:center;border-radius:12px;cursor:pointer}.check{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.result{padding:18px;border-radius:12px;background:#fafafa;line-height:1.65}.result h2{margin-top:0;color:var(--primary)}.result a{color:#a54d00;word-break:break-word}.sources{margin-top:20px;padding-top:15px;border-top:1px solid #ff7b0030}.error{color:var(--danger);margin-top:12px}.loading{display:none;color:#666;margin-top:12px}
</style></head><body><main class="container"><h1>FRAUD & MISINFORMATION CHECK</h1><p class="subtitle">Check suspicious messages, claims, offers and images using current evidence.</p><section class="card"><div class="split"><div class="panel"><h2>Content to Check</h2><div class="toggle"><button class="active" data-mode="text">Text</button><button data-mode="image">Image</button></div><div id="text-mode" class="mode active"><textarea id="text-input" placeholder="Paste the suspicious message, claim, offer or news..."></textarea></div><div id="image-mode" class="mode"><div class="upload" id="upload">Click to choose an image</div><input id="image-input" type="file" accept=".png,.jpg,.jpeg,.webp" hidden><p id="filename"></p></div><button class="check" id="check">VERIFY WITH LIVE EVIDENCE</button><div class="loading" id="loading">Checking current sources...</div><div class="error" id="error"></div></div><div class="panel"><div class="result" id="result">Your evidence-based verdict will appear here.</div></div></div></section></main>
<script>
const buttons=[...document.querySelectorAll('.toggle button')],modes={text:document.getElementById('text-mode'),image:document.getElementById('image-mode')};buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');Object.values(modes).forEach(x=>x.classList.remove('active'));modes[b.dataset.mode].classList.add('active')});
const upload=document.getElementById('upload'),image=document.getElementById('image-input'),filename=document.getElementById('filename');upload.onclick=()=>image.click();image.onchange=()=>filename.textContent=image.files[0]?.name||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const render=s=>esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
const links=items=>(items||[]).map(v=>`<li><a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a></li>`).join('');
document.getElementById('check').onclick=async()=>{const error=document.getElementById('error'),loading=document.getElementById('loading'),result=document.getElementById('result');error.textContent='';loading.style.display='block';try{const mode=document.querySelector('.toggle button.active').dataset.mode;let response;if(mode==='image'){if(!image.files[0])throw new Error('Please choose an image.');const form=new FormData();form.append('image',image.files[0]);response=await fetch('/api/v1/fraud/analyze',{method:'POST',body:form});}else{const text=document.getElementById('text-input').value.trim();if(!text)throw new Error('Please enter the suspicious content first.');const form=new FormData();form.append('text',text);response=await fetch('/api/v1/fraud/analyze',{method:'POST',body:form});}const data=await response.json();if(!response.ok)throw new Error(data.detail||'Verification failed.');const x=data.data||{};result.innerHTML=`<h2>${esc(x.result_class||'Unverified___Needs_Caution')}</h2><p>${render(x.response||'No detailed verification response returned.')}</p>${(x.sources||[]).length?`<div class="sources"><h3>Sources</h3><ul>${links(x.sources)}</ul></div>`:''}`;}catch(e){error.textContent=e.message||'Request failed.'}finally{loading.style.display='none'}};
</script></body></html>
