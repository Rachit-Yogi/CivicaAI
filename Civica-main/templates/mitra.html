<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mitra AI</title>
<style>
:root{--primary:#ff7b00;--bg1:#e0f7fa;--bg2:#c5e1a5;--text:#212529}*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:grid;place-items:center;padding:20px}.chat{width:min(1200px,95%);height:85vh;background:#ffffff99;backdrop-filter:blur(12px);border:1px solid #ffffff66;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}.head,.input{padding:18px 28px;background:#ffffff66;border-bottom:1px solid #ffffff66}.head h1{margin:0;font-size:1.2rem}.messages{flex:1;padding:28px;overflow:auto;display:flex;flex-direction:column;gap:16px}.msg{max-width:70%;padding:13px 18px;border-radius:12px;line-height:1.5}.bot{align-self:flex-start;background:#ffffffb3;color:var(--text)}.user{align-self:flex-end;background:var(--primary);color:#fff}.input{border-top:1px solid #ffffff66;border-bottom:0;display:flex;gap:12px}.input input{flex:1;padding:14px 18px;border:1px solid #ffffff88;border-radius:28px;background:#ffffff80;font-size:1rem}.input button{width:52px;height:52px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.typing{display:none;padding:0 28px 8px;color:#666;font-size:.85rem}
</style></head><body><main class="chat"><header class="head"><h1>Mitra AI · Digital Literacy Assistant</h1></header><div class="messages" id="chat-box"><div class="msg bot">Hello! I am Mitra, your digital literacy assistant. Ask me about spotting fake news or staying safe online.</div></div><div class="typing" id="typing">Mitra is thinking...</div><div class="input"><input id="user-input" type="text" placeholder="Type your message..." autocomplete="off"><button id="send">Send</button></div></main>
<script>
const input=document.getElementById('user-input'),box=document.getElementById('chat-box'),typing=document.getElementById('typing');let history=[];
const add=(who,text)=>{const el=document.createElement('div');el.className=`msg ${who}`;el.textContent=text;box.appendChild(el);box.scrollTop=box.scrollHeight};
async function send(){const message=input.value.trim();if(!message)return;add('user',message);input.value='';typing.style.display='block';try{const r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Chat request failed.');add('bot',d.response||'No response returned.');history.push({role:'user',text:message},{role:'model',text:d.response||''});}catch(e){add('bot',`Error: ${e.message}`)}finally{typing.style.display='none'}}
document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
