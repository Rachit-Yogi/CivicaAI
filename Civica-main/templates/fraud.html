<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Digital Literacy Helper</title>
<style>
:root{--primary:#ff7b00;--bg:#fff7ed;--text:#222}*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff,#fff1df);display:grid;place-items:center;padding:24px}.container{width:min(1100px,100%)}h1{text-align:center;color:var(--primary)}.subtitle{text-align:center;color:#666}.card{background:#fff;border:1px solid #ff7b0030;border-radius:20px;padding:28px;box-shadow:0 12px 32px #ff7b0018}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:800px){.split{grid-template-columns:1fr}}.panel{border:1px solid #ff7b0030;border-radius:14px;padding:20px}.toggle{display:flex;gap:8px;margin-bottom:14px}.toggle button{flex:1;padding:10px;border:0;border-radius:9px;cursor:pointer;background:#ff7b0018}.toggle button.active{background:var(--primary);color:#fff}.mode{display:none}.mode.active{display:block}textarea{width:100%;min-height:180px;padding:12px;border:1px solid #ff7b0040;border-radius:9px;resize:vertical}.upload{padding:40px;border:2px dashed #ff7b0066;text-align:center;border-radius:12px;cursor:pointer}.check{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.result{margin-top:10px;padding:18px;border-radius:12px;background:#fafafa}.result h2{margin-top:0;color:var(--primary)}.status{font-weight:700}.error{color:#b42318;margin-top:12px}.loading{display:none;color:#666;margin-top:12px}
</style></head><body><main class="container"><h1>DIGITAL LITERACY HELPER</h1><p class="subtitle">Verify news, detect scams, and stay safe online</p><section class="card"><div class="split"><div class="panel"><h2>Fake News / Fraud Detection</h2><div class="toggle"><button class="active" data-mode="text">Text</button><button data-mode="image">Image</button></div><div id="text-mode" class="mode active"><textarea id="text-input" placeholder="Paste suspicious news or message..."></textarea></div><div id="image-mode" class="mode"><div class="upload" id="upload">Click to choose an image</div><input id="image-input" type="file" accept=".png,.jpg,.jpeg,.webp" hidden><p id="filename"></p></div><button class="check" id="check">CHECK</button><div class="loading" id="loading">Analyzing...</div><div class="error" id="error"></div></div><div class="panel"><div class="result" id="result">Result will appear here.</div></div></div></section></main>
<script>
const buttons=[...document.querySelectorAll('.toggle button')],modes={text:document.getElementById('text-mode'),image:document.getElementById('image-mode')};buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');Object.values(modes).forEach(x=>x.classList.remove('active'));modes[b.dataset.mode].classList.add('active')});
const upload=document.getElementById('upload'),image=document.getElementById('image-input'),filename=document.getElementById('filename');upload.onclick=()=>image.click();image.onchange=()=>filename.textContent=image.files[0]?.name||'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('check').onclick=async()=>{const error=document.getElementById('error'),loading=document.getElementById('loading'),result=document.getElementById('result');error.textContent='';loading.style.display='block';try{const mode=document.querySelector('.toggle button.active').dataset.mode;let r;if(mode==='image'){if(!image.files[0])throw new Error('Please choose an image.');const f=new FormData();f.append('image',image.files[0]);r=await fetch('/api/v1/fraud/analyze',{method:'POST',body:f})}else{const text=document.getElementById('text-input').value.trim();if(!text)throw new Error('Please enter text first.');const f=new FormData();f.append('text',text);r=await fetch('/api/v1/fraud/analyze',{method:'POST',body:f})}const d=await r.json();if(!r.ok)throw new Error(d.detail||'Analysis failed.');const x=d.data||{};result.innerHTML=`<h2>${esc((x.result_class||'Unverified').replaceAll('_',' '))}</h2><p>${esc(x.result_text)}</p>${x.result_details?`<p><b>Details:</b> ${esc(x.result_details)}</p>`:''}`;}catch(e){error.textContent=e.message}catch(e){error.textContent='Request failed.'}finally{loading.style.display='none'}};
</script></body></html>
