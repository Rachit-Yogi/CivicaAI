<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Literacy Helper - Fake News Detection</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ============================
       CIVICA STYLE (SAFE VERSION)
       ============================ */

    :root {
      --primary: hsl(26, 100%, 50%);
      --primary-light: hsl(26, 100%, 60%);
      --bg-start: #ffffff;
      --bg-end: hsl(30, 100%, 93%);
      --text-main: #222;
      --text-muted: #666;
      --card-bg: #ffffff;
      --border: hsla(26,100%,50%,0.3);
      --shadow: 0 12px 32px hsla(26,100%,50%,0.15);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-start), var(--bg-end));
      color: var(--text-main);
      padding: 4rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 0.4rem;
      color: var(--text-muted);
    }

    .main-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .content-split {
      display: flex;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .content-split {
        flex-direction: column;
      }
    }

    .input-panel,
    .result-panel {
      flex: 1;
      background: #fff;
      padding: 1.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .input-panel h2 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .input-toggle {
      display: flex;
      gap: 0.5rem;
      background: hsla(26,100%,50%,0.1);
      padding: 0.4rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
    }

    .toggle-btn {
      flex: 1;
      border: none;
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      font-weight: 500;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .input-mode {
      display: none;
    }

    .input-mode.active {
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
    }

    .check-button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }

    .check-button:hover {
      background: var(--primary-light);
    }

    .loader {
      display: none;
      text-align: center;
    }

    .loader.active {
      display: block;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid hsla(26,100%,50%,0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      padding: 1.25rem;
      border-left: 6px solid;
      border-radius: 12px;
      text-align: left;
    }

    .result-Likely_Fake {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .result-Likely_Real {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .result-Unverified___Needs_Caution {
      background: #fef3c7;
      border-color: #ca8a04;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>DIGITAL LITERACY HELPER</h1>
    <p class="subtitle">Verify news, detect schemes, stay safe online</p>
  </header>

  <!-- FORM (UNCHANGED AS REQUESTED) -->
  <form action="{{ url_for('analyze_fraud') }}"
        method="post"
        enctype="multipart/form-data"
        id="analysisForm">

    <div class="main-card">
      <div class="content-split">

        <!-- INPUT -->
        <div class="input-panel">
          <h2>Fake News / Scheme Detection</h2>

          <div class="input-toggle">
            <button type="button" class="toggle-btn active" data-mode="text">📝 Text</button>
            <button type="button" class="toggle-btn" data-mode="image">🖼️ File</button>
          </div>

          <div id="textMode" class="input-mode active">
            <textarea name="textInput" placeholder="Paste suspicious news or message..."></textarea>
          </div>

          <div id="imageMode" class="input-mode">
            <div class="upload-area" id="uploadArea">
              <i class="fas fa-cloud-upload-alt fa-2x"></i>
              <p>Click or Drop file</p>
              <p id="fileName"></p>
            </div>
            <input type="file" id="imageUpload" name="imageUpload" hidden>
          </div>

          <button class="check-button" id="checkButton">CHECK</button>
        </div>

        <!-- RESULT -->
        <div class="result-panel">
          <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Analyzing...</p>
          </div>
          <div id="resultsOutput">
            <p style="color:#999">Result will appear here</p>
          </div>
        </div>

      </div>
    </div>
  </form>

</div>

<script>
const FLASK_INITIAL_DATA_STRING = '{{ initial_data | default({}) | tojson | safe }}';

document.addEventListener("DOMContentLoaded", () => {

  const toggleBtns = document.querySelectorAll(".toggle-btn");
  const textMode = document.getElementById("textMode");
  const imageMode = document.getElementById("imageMode");
  const uploadArea = document.getElementById("uploadArea");
  const imageUpload = document.getElementById("imageUpload");
  const fileName = document.getElementById("fileName");
  const loader = document.getElementById("loader");
  const resultsOutput = document.getElementById("resultsOutput");
  const form = document.getElementById("analysisForm");

  toggleBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      toggleBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (btn.dataset.mode === "text") {
        textMode.classList.add("active");
        imageMode.classList.remove("active");
      } else {
        imageMode.classList.add("active");
        textMode.classList.remove("active");
      }
    });
  });

  uploadArea.onclick = () => imageUpload.click();
  imageUpload.onchange = () => fileName.textContent = imageUpload.files[0]?.name || "";

  form.addEventListener("submit", () => {
    loader.classList.add("active");
    resultsOutput.innerHTML = "";
  });

  function renderResult(data){
    if(!data.result_class) return;

    resultsOutput.innerHTML = `
      <div class="result-card result-${data.result_class}">
        <h3>${data.result_class.replaceAll("_"," ")}</h3>
        <p>${data.result_text || ""}</p>
        ${data.result_details ? `<p><b>Details:</b> ${data.result_details}</p>` : ""}
      </div>`;
    loader.classList.remove("active");
  }

  try {
    const initialData = JSON.parse(FLASK_INITIAL_DATA_STRING || "{}");
    renderResult(initialData);
  } catch(e){ console.error(e); }
});
</script>

</body>
</html>
